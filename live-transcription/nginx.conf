worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Translate the Upgrade header into the correct Connection header value.
    # Without this, WebSocket upgrades will not pass through.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Two WhisperLive backends, each capped at 2 concurrent connections.
    # least_conn suits long-lived WebSocket streams better than round-robin:
    # it sends each new client to whichever instance currently has fewer.
    upstream whisperlive {
        least_conn;
        server whisper-live-1:9090 max_conns=2;
        server whisper-live-2:9090 max_conns=2;
        # With both instances full (4 live clients), nginx returns 502 to a 5th.
        # (The `queue` directive that would make it wait instead is nginx Plus only.)
    }

    server {
        listen 80;

        location / {
            proxy_pass http://whisperlive;

            # --- Required for WebSocket ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep long-lived streams alive. Match or slightly exceed the server's
            # WHISPERLIVE_MAX_CONNECTION_TIME (default 600s) so nginx isn't the one
            # cutting sessions early.
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}