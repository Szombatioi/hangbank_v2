services:
  whisperlivekit:
    build:
      context: ./repo
      dockerfile: Dockerfile.cpu
      args:
        EXTRAS: cpu
    container_name: whisperlivekit
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: >
      --model tiny --language auto
      --backend faster-whisper --backend-policy simulstreaming
      --pcm-input --host 0.0.0.0 --port 8000