services:
  whisperlivekit:
    build:
      context: ./repo
      dockerfile: Dockerfile
      args:
        EXTRAS: cpu #TODO: Is this needed?
    container_name: whisperlivekit
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: >
      --model large-v3 --language auto
      --backend faster-whisper --backend-policy simulstreaming
      --pcm-input --host 0.0.0.0 --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
